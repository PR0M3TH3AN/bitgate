<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BitGate">
  <defs>
    <linearGradient id="bg-gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc9a4"/>
      <stop offset="1" stop-color="#1f9b7d"/>
    </linearGradient>
    <linearGradient id="bg-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c481"/>
      <stop offset="1" stop-color="#b3924a"/>
    </linearGradient>
  </defs>
  <!-- Brass ring: the family mark shared with BitLogin. -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#bg-brass)" stroke-width="2.5"/>
  <!-- The gate itself: an arch with one leaf swung open. -->
  <path d="M21 43V27a11 11 0 0 1 22 0v16" fill="none" stroke="url(#bg-gate)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M32 43V21" stroke="url(#bg-brass)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M36 34.5l3.4 3.4 6.6-7.4" fill="none" stroke="url(#bg-gate)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
